name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a new push to the same PR makes the previous run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Back end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # unit tests, integration tests (*IT, PostgreSQL via Testcontainers on the runner's Docker) and the JaCoCo report
      - name: Build e testes
        run: ./mvnw -B verify
      - name: Resumo da cobertura
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          [ -f "$csv" ] || exit 0
          awk -F, 'NR > 1 { lm += $8; lc += $9; bm += $6; bc += $7 }
            END {
              printf "### Cobertura do back end\n\n| Linhas | Branches |\n|---:|---:|\n| %.1f%% | %.1f%% |\n",
                100 * lc / (lc + lm), 100 * bc / (bc + bm)
            }' "$csv" >> "$GITHUB_STEP_SUMMARY"
      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-back-end
          path: target/site/jacoco
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Front end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependências
        run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm run coverage -- --coverage.reporter=text-summary --coverage.reporter=html --coverage.reporter=json-summary
      - name: Resumo da cobertura
        if: always()
        run: |
          summary=coverage/coverage-summary.json
          [ -f "$summary" ] || exit 0
          node -e '
            const total = require("./" + process.argv[1]).total;
            console.log("### Cobertura do front end\n\n| Linhas | Branches |\n|---:|---:|\n| " +
              total.lines.pct + "% | " + total.branches.pct + "% |");
          ' "$summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-front-end
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 14
      - name: Build
        run: npm run build
