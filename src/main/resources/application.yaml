spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: prumo
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5433/prumo_db?sslmode=disable}
    username: ${DATASOURCE_USERNAME:app}
    password: ${DATASOURCE_PASSWORD:app}
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,user:email
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
