spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: prumo
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5433/prumo_db?sslmode=disable}
    username: ${DATASOURCE_USERNAME:app}
    password: ${DATASOURCE_PASSWORD:app}
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,user:email
            # Where GitHub sends the browser back. The default follows the host the backend was reached on;
            # set OAUTH_REDIRECT_URI to the front end address when logging in from another machine (docs/rede-local.md).
            redirect-uri: ${OAUTH_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:prumo}
      private-key: ${JWT_PRIVATE_KEY_PATH:file:./keys/private.pem}
      public-key: ${JWT_PUBLIC_KEY_PATH:file:./keys/public.pem}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
  oauth:
    frontend-callback-url: ${FRONTEND_OAUTH_CALLBACK_URL:http://localhost:3000/auth/callback}
    code-ttl: ${OAUTH_CODE_TTL:60s}
    github-api-url: ${GITHUB_API_URL:https://api.github.com}

  github:
    api-url: ${GITHUB_API_URL:https://api.github.com}
    encryption-key: ${PRUMO_ENCRYPTION_KEY:}
    polling:
      enabled: ${GITHUB_POLLING_ENABLED:true}
      interval: ${GITHUB_POLLING_INTERVAL:60s}

server:
  # Local only by default. The front end reaches the backend from the same machine; use 0.0.0.0 only if something else must.
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
